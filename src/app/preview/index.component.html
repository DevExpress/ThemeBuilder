@if (isStylesReady) {
  <div id="preview-container" [ngClass]="typographyClass">
    @if (viewName === 'preview') {
      <app-preview [widgetName]="widgetName"></app-preview>
    }
    @if (viewName === 'wizard') {
      <app-wizard [theme]="themeName" [themeSize]="themeSize"></app-wizard>
    }
  </div>
}
