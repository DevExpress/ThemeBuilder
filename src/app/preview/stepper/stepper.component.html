@if (isExpanded.getValue()) {
  <div class="options-block" id="stepperOptionsBlock">
    <label class="group-label">Step Type:</label>
    <dx-button-group
      keyExpr="showIcons"
      [items]="stepperTypes"
      [width]="200"
      [selectedItemKeys]="[showIcons]"
      (onItemClick)="toggleStepperType($event)"
      />
      <div class="vertical-separator"></div>
      <label class="group-label">isValid:</label>
      <dx-select-box
        [items]="isValidOptions"
        [(value)]="selectedOption"
        keyExpr="id"
        [width]="120"
        displayExpr="text"
        (onValueChanged)="toggleValidation($event)"
      ></dx-select-box>
      <div class="vertical-separator"></div>
      <dx-check-box
        text="Show Label"
        [value]="showLabel"
        (onValueChanged)="toggleLabel($event)"
      ></dx-check-box>
      <dx-check-box
        text="Show Optional Text"
        [value]="showOptionalText"
        (onValueChanged)="toggleOptionalText($event)"
      ></dx-check-box>
      <div class="vertical-separator"></div>
      <dx-check-box
        text="Step Disabled State"
        [value]="disabledSteps"
        (onValueChanged)="toggleDisabledSteps($event)"
      ></dx-check-box>
    </div>
    <div class="stepper-wrapper stepper-wrapper-extended">
      <dx-stepper
        id="stepper"
        [selectedIndex]="2"
        [orientation]="'horizontal'"
        [linear]="false"
        [selectOnFocus]="false"
        [rtlEnabled]="false"
        >
        @for (step of steps; track step) {
          <dxi-stepper-item
            [label]="showLabel ? step.label : ''"
            [icon]="showIcons ? step.icon : ''"
            [text]="step.text"
            [optional]="showOptionalText ? step.optional : ''"
            [isValid]="step.isValid"
            [disabled]="step.disabled"
          ></dxi-stepper-item>
        }
      </dx-stepper>
    </div>
  } @else {
    <div class="stepper-wrapper">
      <dx-stepper
        id="stepper"
        [selectedIndex]="2"
        [orientation]="'horizontal'"
        [linear]="false"
        [selectOnFocus]="false"
        [rtlEnabled]="false"
        >
        @for (step of steps; track step) {
          <dxi-stepper-item
            [label]="step.label"
            [icon]="step.icon"
            [text]="step.text"
            [optional]="step.optional"
          ></dxi-stepper-item>
        }
      </dx-stepper>
    </div>
  }
